<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Visual Studio Code - word_matrix.json</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', 'Courier New', monospace; margin: 0; display: flex; height: 100vh; font-size: 13px; overflow: hidden; }
        .sidebar { width: 220px; background: #252526; border-right: 1px solid #333; padding: 10px; display: flex; flex-direction: column; }
        .sidebar-title { color: #6d6d6d; font-weight: bold; margin-bottom: 12px; font-size: 11px; letter-spacing: 1px; }
        .file-tree { padding-left: 5px; }
        .file.active { background: #37373d; color: #fff; padding: 5px 10px; margin-left: -10px; width: calc(100% + 10px); }
        .editor { flex-grow: 1; display: flex; flex-direction: column; background: #1e1e1e; }
        .tabs { background: #2d2d2d; display: flex; height: 35px; align-items: center; }
        .tab { padding: 0 20px; background: #1e1e1e; color: #fff; border-top: 1px solid #007acc; height: 100%; display: flex; align-items: center; font-size: 12px; }
        .code-area { padding: 20px 40px; line-height: 1.6; overflow-y: auto; }
        .syntax-purple { color: #c586c0; }
        .syntax-blue { color: #569cd6; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
        .word { border: 1px solid #3c3c3c; padding: 15px 10px; cursor: pointer; color: #ce9178; border-left: 3px solid transparent; }
        .word:hover { background: #2a2d2e; }
        
        /* États visuels */
        .agent { color: #6a9955 !important; font-style: italic; border-color: #6a9955 !important; background: rgba(106, 153, 85, 0.1); pointer-events: none; }
        .civil { opacity: 0.4; text-decoration: line-through; border-color: #333 !important; }
        .assassin { color: #f44747 !important; font-weight: bold; border-color: #f44747 !important; background: rgba(244, 71, 71, 0.2); pointer-events: none; }
        
        /* Indices */
        .hint-green { border-left: 3px solid #6a9955 !important; }
        .hint-black { border-left: 3px solid #f44747 !important; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-title">EXPLORER</div>
        <div class="file-tree">
            <div class="syntax-blue">▼ src</div>
            <div class="file active">word_matrix.json</div>
        </div>
    </div>
    <div class="editor">
        <div class="tabs"><div class="tab">word_matrix.json</div></div>
        <div class="code-area">
            <span class="syntax-purple">export</span> <span class="syntax-blue">const</span> nodes = [
            <div class="grid" id="board"></div>
            ];
        </div>
    </div>

    <script>
        // Injection Supabase
        const script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        script.onload = () => startApp();
        document.head.appendChild(script);

        function startApp() {
            const SUPABASE_URL = 'https://ftvxmlxdovbgcxdayzvn.supabase.co'; 
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0dnhtbHhkb3ZiZ2N4ZGF5enZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NzgwNDcsImV4cCI6MjA5NDA1NDA0N30.IOHBBGzED0FV1xRYKOMsJapjACpeX2JVEhfNgXXT4B8'; 
            const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const urlParams = new URLSearchParams(window.location.search);
            const myRole = (urlParams.get('role') || 'A').toUpperCase(); 

            async function loadGame() {
                const { data, error } = await mySupabase.from('game_state').select('*').order('id', { ascending: true });
                if (error) { console.error(error); return; }

                const board = document.getElementById('board');
                board.innerHTML = ''; 

                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'word';
                    div.innerText = `"${item.word}",`;

                    // Gestion des statuts
                    const statusMe = (myRole === 'A') ? item.status_a : item.status_b;
                    const statusOther = (myRole === 'A') ? item.status_b : item.status_a;
                    
                    // Si le mot est trouvé par quelqu'un ou est l'assassin
                    if (item.status_a === 'agent' || item.status_b === 'agent') {
                        div.classList.add('agent');
                    } else if (item.status_a === 'assassin' || item.status_b === 'assassin') {
                        div.classList.add('assassin');
                    } else if (statusMe === 'civil') {
                        div.classList.add('civil');
                    }

                    // Affichage des indices personnels (si pas déjà trouvé)
                    if (!div.classList.contains('agent') && !div.classList.contains('assassin')) {
                        const myView = (myRole === 'A') ? item.role_a_view : item.role_b_view;
                        if (myView === 'green') div.classList.add('hint-green');
                        if (myView === 'black') div.classList.add('hint-black');
                    }

                    // Logique du clic
                    div.onclick = async () => {
                        // On ne peut cliquer que si le mot est "neutre" OU "civil" chez nous 
                        // (pour permettre de trouver un mot que l'autre a besoin même si on s'est trompé avant)
                        if (div.classList.contains('agent') || div.classList.contains('assassin')) return;
                        
                        // Si le mot est déjà civil CHEZ MOI, on peut quand même cliquer pour tenter l'agent de l'autre
                        if (statusMe === 'agent' || statusMe === 'assassin') return;

                        const otherView = (myRole === 'A') ? item.role_b_view : item.role_a_view;
                        let result = 'civil'; 
                        if (otherView === 'green') result = 'agent';
                        if (otherView === 'black') result = 'assassin';

                        const updateData = (myRole === 'A') ? { status_a: result } : { status_b: result };
                        
                        await mySupabase.from('game_state').update(updateData).eq('id', item.id);
                        loadGame(); 
                    };
                    board.appendChild(div);
                });
            }
            setInterval(loadGame, 2000);
            loadGame();
        }
    </script>
</body>
</html>
