<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Visual Studio Code - word_matrix.json</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', monospace; margin: 0; display: flex; height: 100vh; font-size: 13px; overflow: hidden; flex-direction: row; }
        .sidebar { width: 200px; background: #252526; border-right: 1px solid #333; padding: 10px; flex-shrink: 0; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; }
        .tabs { background: #2d2d2d; display: flex; height: 35px; align-items: center; justify-content: space-between; padding-right: 10px; flex-shrink: 0; }
        .tab { padding: 0 20px; background: #1e1e1e; color: #fff; border-top: 1px solid #007acc; height: 100%; display: flex; align-items: center; }
        
        .code-area { flex-grow: 1; padding: 20px 40px; line-height: 1.6; overflow-y: auto; background: #1e1e1e; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
        .word { border: 1px solid #3c3c3c; padding: 15px 10px; cursor: pointer; color: #ce9178; border-left: 3px solid transparent; }
        .word:hover { background: #2a2d2e; }

        /* Terminal Panel */
        .terminal-panel { height: 220px; background: #1e1e1e; border-top: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
        .terminal-tabs { background: #1e1e1e; display: flex; padding: 0 20px; gap: 20px; height: 30px; align-items: center; border-bottom: 1px solid #2d2d2d; }
        .terminal-tab { font-size: 11px; color: #858585; cursor: pointer; text-transform: uppercase; }
        .terminal-tab.active { color: #fff; border-bottom: 1px solid #fff; padding-bottom: 2px; }
        
        .terminal-content { flex-grow: 1; padding: 10px 20px; font-family: 'Consolas', monospace; overflow-y: auto; display: flex; flex-direction: column; }
        .history-log { color: #808080; font-size: 11px; line-height: 1.4; margin-bottom: 10px; border-bottom: 1px solid #2d2d2d; padding-bottom: 5px; }
        .terminal-input-row { display: flex; align-items: center; gap: 8px; margin-top: auto; color: #ccc; padding-top: 10px; }
        
        .term-in { background: transparent; border: none; color: #ce9178; outline: none; font-family: inherit; font-size: 13px; }
        .term-text { width: 200px; }
        .term-num { width: 30px; }
        
        .deploy-btn { background: #007acc; color: white; border: none; padding: 4px 12px; font-size: 11px; cursor: pointer; border-radius: 2px; }
        .deploy-btn:disabled { background: #3e3e42; color: #858585; cursor: not-allowed; }

        /* Status Colors */
        .agent { color: #6a9955 !important; font-style: italic; border-color: #6a9955 !important; background: rgba(106, 153, 85, 0.1); pointer-events: none; }
        .civil { opacity: 0.4; text-decoration: line-through; border-color: #333 !important; }
        .assassin { color: #f44747 !important; font-weight: bold; border-color: #f44747 !important; background: rgba(244, 71, 71, 0.4) !important; pointer-events: none; }
        .hint-green { border-left: 3px solid #6a9955 !important; }
        .hint-black { border-left: 3px solid #f44747 !important; }

        .not-your-turn { opacity: 0.5; pointer-events: none; filter: grayscale(0.5); }
        .game-over-active { pointer-events: none !important; }
        
        .status-bar { background: #007acc; color: white; padding: 2px 10px; font-size: 11px; height: 22px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .status-bar.error { background: #f44747; }
        .syntax-purple { color: #c586c0; }
        .syntax-blue { color: #569cd6; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div style="color: #6d6d6d; font-size: 11px; margin-bottom: 10px;">EXPLORER</div>
        <div class="syntax-blue">▼ src</div>
        <div style="padding-left: 15px; color: #fff; background: #37373d;">word_matrix.json</div>
    </div>

    <div class="main-content">
        <div class="tabs">
            <div class="tab">word_matrix.json</div>
            <button id="endTurnBtn" class="deploy-btn">DEPLOY: COMMIT_CHANGES</button>
        </div>

        <div class="code-area">
            <span class="syntax-purple">export</span> <span class="syntax-blue">const</span> nodes = [
            <div class="grid" id="board">Initializing kernel...</div>
            ];
        </div>

        <div class="terminal-panel">
            <div class="terminal-tabs">
                <div class="terminal-tab">Output</div>
                <div class="terminal-tab">Debug Console</div>
                <div class="terminal-tab active">Terminal</div>
            </div>
            <div class="terminal-content">
                <div id="clueHistory" style="overflow-y: auto; flex-grow: 1;">
                    <!-- L'historique apparaîtra ici -->
                </div>
                
                <div class="terminal-input-row" id="inputZone">
                    <span>antoine@master:~$ ./push_clue --val</span>
                    <input type="text" id="clueText" class="term-in term-text" placeholder='"string"'>
                    <span>--count</span>
                    <input type="number" id="clueNum" class="term-in term-num" min="1" max="8" value="1">
                    <button id="sendClueBtn" class="deploy-btn" style="background: #333; margin-left: 10px;">EXECUTE</button>
                </div>
            </div>
        </div>

        <div class="status-bar" id="statusBar">
            <span id="processText">Process: Connected (Port 5432)</span>
            <span id="turnIndicator">Role: -</span>
        </div>
    </div>

    <script>
        const script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        script.onload = () => startApp();
        document.head.appendChild(script);

        function startApp() {
            const SUPABASE_URL = 'https://ftvxmlxdovbgcxdayzvn.supabase.co'; 
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0dnhtbHhkb3ZiZ2N4ZGF5enZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NzgwNDcsImV4cCI6MjA5NDA1NDA0N30.IOHBBGzED0FV1xRYKOMsJapjACpeX2JVEhfNgXXT4B8'; 
            const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const urlParams = new URLSearchParams(window.location.search);
            const myRole = (urlParams.get('role') || 'A').toUpperCase();

            // Envoyer l'indice (Nouvelle ligne dans la table)
            document.getElementById('sendClueBtn').onclick = async () => {
                const text = document.getElementById('clueText').value.replace(/"/g, '');
                const num = document.getElementById('clueNum').value;
                if (!text) return;
                await mySupabase.from('game_hints').insert([{ clue_text: text, clue_number: num, sent_by: myRole }]);
                document.getElementById('clueText').value = '';
                loadGame();
            };

            async function toggleTurn() {
                const nextTurn = (myRole === 'A') ? 'B' : 'A';
                await mySupabase.from('game_control').update({ current_turn: nextTurn }).eq('id', 1);
                loadGame();
            }
            document.getElementById('endTurnBtn').onclick = toggleTurn;

            async function loadGame() {
                const { data: ctrl } = await mySupabase.from('game_control').select('current_turn').eq('id', 1).single();
                const isMyTurn = ctrl.current_turn === myRole;

                // Charger TOUT l'historique des indices
                const { data: allHints } = await mySupabase.from('game_hints').select('*').order('created_at', { ascending: true });
                const historyDiv = document.getElementById('clueHistory');
                historyDiv.innerHTML = '';
                if (allHints) {
                    allHints.forEach(h => {
                        const line = document.createElement('div');
                        line.className = 'history-log';
                        const time = new Date(h.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        line.innerText = `[${time}] ROLE_${h.sent_by}: { clue: "${h.clue_text}", n: ${h.clue_number} }`;
                        historyDiv.appendChild(line);
                    });
                    historyDiv.scrollTop = historyDiv.scrollHeight;
                }

                const { data: words } = await mySupabase.from('game_state').select('*').order('id', { ascending: true });
                const board = document.getElementById('board');
                const btn = document.getElementById('endTurnBtn');
                const statusBar = document.getElementById('statusBar');
                
                const isGameOver = words.some(w => w.status_a === 'assassin' || w.status_b === 'assassin');

                if (isGameOver) {
                    board.className = "grid game-over-active";
                    btn.disabled = true;
                    statusBar.className = "status-bar error";
                    document.getElementById('processText').innerText = "Process: KILLED (FATAL_SIGTERM)";
                    document.getElementById('turnIndicator').innerText = "MEMORY_DUMP: FAILURE";
                } else {
                    board.className = isMyTurn ? "grid" : "grid not-your-turn";
                    btn.disabled = !isMyTurn;
                    statusBar.className = "status-bar";
                    document.getElementById('turnIndicator').innerText = isMyTurn ? `SESSION: ROLE_${myRole}` : `WAITING: ROLE_${ctrl.current_turn}`;
                }
                
                board.innerHTML = ''; 
                words.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'word';
                    div.innerText = `"${item.word}",`;
                    const myStatus = (myRole === 'A') ? item.status_a : item.status_b;
                    
                    if (item.status_a === 'assassin' || item.status_b === 'assassin') div.classList.add('assassin');
                    else if (item.status_a === 'agent' || item.status_b === 'agent') div.classList.add('agent');
                    else if (myStatus === 'civil') div.classList.add('civil');

                    if (!div.classList.contains('agent') && !div.classList.contains('assassin')) {
                        const myView = (myRole === 'A') ? item.role_a_view : item.role_b_view;
                        if (myView === 'green') div.classList.add('hint-green');
                        if (myView === 'black') div.classList.add('hint-black');
                    }

                    div.onclick = async () => {
                        if (isGameOver || !isMyTurn || div.classList.contains('agent') || div.classList.contains('assassin')) return;
                        const otherView = (myRole === 'A') ? item.role_b_view : item.role_a_view;
                        let res = 'civil'; 
                        if (otherView === 'green') res = 'agent';
                        if (otherView === 'black') res = 'assassin';
                        const update = (myRole === 'A') ? { status_a: res } : { status_b: res };
                        await mySupabase.from('game_state').update(update).eq('id', item.id);
                        if (res === 'civil') await toggleTurn();
                        else loadGame();
                    };
                    board.appendChild(div);
                });
            }
            setInterval(loadGame, 2000);
            loadGame();
        }
    </script>
</body>
</html>
