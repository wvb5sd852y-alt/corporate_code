<script>
    const SUPABASE_URL = 'https://ftvxmlxdovbgcxdayzvn.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0dnhtbHhkb3ZiZ2N4ZGF5enZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NzgwNDcsImV4cCI6MjA5NDA1NDA0N30.IOHBBGzED0FV1xRYKOMsJapjACpeX2JVEhfNgXXT4B8'; 

    const mySupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const myRole = urlParams.get('role') || 'A'; 

    async function loadGame() {
        const { data, error } = await mySupabase
            .from('game_state')
            .select('*')
            .order('id', { ascending: true });

        if (error) return;

        const board = document.getElementById('board');
        board.innerHTML = ''; 

        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'word';
            div.innerText = `"${item.word}",`;

            // 1. État REEL (si déjà cliqué)
            if (item.status !== 'neutral') {
                div.classList.add(item.status);
            } 
            // 2. INDICES DISCRETS (ce que je dois faire deviner)
            else {
                const myView = (myRole === 'A') ? item.role_a_view : item.role_b_view;
                if (myView === 'green') div.classList.add('hint-green');
                if (myView === 'black') div.classList.add('hint-black');
            }

            // Action au clic automatique
            div.onclick = async () => {
                if (item.status !== 'neutral') return; // Déjà cliqué

                // On regarde la vue de L'AUTRE pour décider du résultat
                const targetView = (myRole === 'A') ? item.role_b_view : item.role_a_view;
                
                let nextStatus = 'civil'; // Par défaut : mot neutre (gris)
                if (targetView === 'green') nextStatus = 'agent';   // C'était un de ses mots verts
                if (targetView === 'black') nextStatus = 'assassin'; // C'était son assassin

                await mySupabase
                    .from('game_state')
                    .update({ status: nextStatus })
                    .eq('id', item.id);
                
                loadGame(); 
            };

            board.appendChild(div);
        });
    }

    setInterval(loadGame, 2000);
    loadGame();
</script>
