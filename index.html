<!DOCTYPE html>
<html>
<head>
    <title>Visual Studio Code - word_matrix.json</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        body { background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', monospace; margin: 0; display: flex; height: 100vh; font-size: 13px; }
        .sidebar { width: 220px; background: #252526; border-right: 1px solid #333; padding: 10px; }
        .editor { flex-grow: 1; display: flex; flex-direction: column; }
        .tabs { background: #2d2d2d; display: flex; }
        .tab { padding: 10px 20px; background: #1e1e1e; border-right: 1px solid #252526; color: #969696; cursor: default; }
        .tab.active { color: white; border-top: 1px solid #007acc; }
        .code-area { padding: 30px; line-height: 1.6; overflow-y: auto; }
        
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin: 20px 0; }
        .word { 
            border: 1px solid #3c3c3c; padding: 12px; border-radius: 2px;
            cursor: pointer; color: #ce9178; /* Couleur string orange VS Code */
        }
        .word:hover { background: #2a2d2e; }
        
        /* Styles de synchronisation */
        .agent { color: #6a9955 !important; font-style: italic; border-color: #6a9955; } /* Vert */
        .assassin { color: #f44747 !important; border-color: #f44747; text-decoration: underline; } /* Rouge */
        .civil { color: #808080 !important; opacity: 0.5; } /* Gris */
        
        .syntax-purple { color: #c586c0; }
        .syntax-blue { color: #569cd6; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div style="color: #6d6d6d; font-weight: bold; margin-bottom: 12px; font-size: 11px;">EXPLORER</div>
        <div class="syntax-blue">▼ src</div>
        <div style="padding-left: 15px;">main.cpp</div>
        <div style="padding-left: 15px; color: #fff;">word_matrix.json</div>
        <div style="padding-left: 15px;">utils.h</div>
    </div>
    <div class="editor">
        <div class="tabs"><div class="tab active">word_matrix.json</div><div class="tab">main.cpp</div></div>
        <div class="code-area">
            <span class="syntax-purple">export</span> <span class="syntax-blue">const</span> data_grid = {<br>
            &nbsp;&nbsp;<span class="syntax-blue">"session"</span>: <span style="color: #ce9178;">"active_debug_04"</span>,<br>
            &nbsp;&nbsp;<span class="syntax-blue">"nodes"</span>: [
            <div class="grid" id="board"></div>
            &nbsp;&nbsp;]
            <br>};
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // On change le nom ici pour éviter le conflit
    const SUPABASE_URL = 'https://ftvxmlxdovbgcxdayzvn.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_VtSjBXRL5EvJwHZSK0G4Yw_-z1eK8Fu';

    // On utilise "mySupabase" au lieu de "supabase"
    const mySupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadGame() {
        const { data, error } = await mySupabase
            .from('game_state')
            .select('*');

        if (error) {
            console.error('Erreur de connexion :', error.message);
            return;
        }

        const board = document.getElementById('board');
        board.innerHTML = ''; 

        data.forEach(item => {
            const div = document.createElement('div');
            div.className = `word ${item.status}`;
            div.innerText = `"${item.word}",`; 
            
            div.onclick = async () => {
                // Si neutre -> devient agent. Si agent -> revient neutre.
                const nextStatus = (item.status === 'neutral') ? 'agent' : 'neutral';
                
                await mySupabase
                    .from('game_state')
                    .update({ status: nextStatus })
                    .eq('id', item.id);
                
                loadGame(); 
            };
            board.appendChild(div);
        });
    }

    setInterval(loadGame, 2000);
    loadGame();
</script>
</body>
</html>
